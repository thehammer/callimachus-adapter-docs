[package]
name = "callimachus-adapter-docs"
version = "0.1.0"
edition = "2024"
authors = ["Hammer <hammer@carefeed.com>"]
license = "AGPL-3.0-only"
description = "Callimachus adapter for Apple DocC JSON documentation — structured edges, rich entity taxonomy"
repository = "https://github.com/thehammer/callimachus-adapter-docs"

[dependencies]
callimachus-adapter-contract = { git = "https://github.com/thehammer/callimachus", rev = "3d557436147be45b28abe9f0f4b4a4d1a418133e" }
callimachus-llm = { git = "https://github.com/thehammer/callimachus", rev = "3d557436147be45b28abe9f0f4b4a4d1a418133e" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
walkdir = "2"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
hex = "0.4"
regex = "1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
callimachus-core = { git = "https://github.com/thehammer/callimachus", rev = "3d557436147be45b28abe9f0f4b4a4d1a418133e" }
